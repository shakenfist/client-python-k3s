[tox]
envlist = flake8
isolated_build = true

[testenv]
extras =
  test
allowlist_externals =
  bash
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  PYTHONDONTWRITEBYTECODE=1

[testenv:flake8]
description =
  Run style checks on the changes made since HEAD~.
envdir = {toxworkdir}/shared
commands =
  bash tools/flake8wrap.sh -HEAD
