[tox]
envlist = py3,flake8
isolated_build = true

[testenv]
extras =
  test
# ansible-core is a dependency of this repository's test environment and
# not of the published package's test extra, which is why it is here and
# not in pyproject.toml. Nothing in shakenfist_client_k3s imports ansible;
# the Ansible module under collection/ does, and its tests import it, so
# the suite needs ansible.module_utils.basic importable. Putting it in the
# test extra would make "pip install shakenfist_client_k3s[test]" pull
# ansible-core in order to run the library's own tests, which is backwards.
# Unbounded deliberately, and not innocently: the resolver picks the
# newest ansible-core, so collection/meta/runtime.yml's
# requires_ansible '>=2.15.0' is advertised and never exercised. Two
# behaviour changes inside that range have already been found by tests
# here (2.21 made both `invocation` and traceback capture opt-in), so
# the untested floor is a real gap rather than a tidiness one. Pinning a
# range would hide it rather than close it; closing it needs an older
# Python than this environment has, because ansible-core 2.15 does not
# run on 3.13. Tracked in shakenfist/client-python-k3s#91.
deps =
  ansible-core
allowlist_externals =
  bash
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  PYTHONDONTWRITEBYTECODE=1
commands =
  stestr run {posargs}

[testenv:py3]
description =
  Run unit tests.

[testenv:flake8]
description =
  Run style checks on the changes made since HEAD~.
envdir = {toxworkdir}/shared
commands =
  bash tools/flake8wrap.sh -HEAD
