[build-system]
# These are the packages needed to *build* this one, and the floors have
# to be true: an sdist carries this table forever, so a wrong floor is
# wrong for the life of the release. 77.0.1 is the first installable
# setuptools which accepts the SPDX license string and the license-files
# key used below -- 76.1.0 rejects them during pyproject validation, and
# nothing warns, because an isolated build quietly installs something
# newer. setuptools_scm needs no particular version for the one key this
# project sets, git_describe_command, which has been understood since
# 6.x; the [simple] extra it used to ask for did not exist until 9.2.0
# and is empty even there, so naming it only produced an ignored
# request. build, twine and wheel are not build dependencies: the first
# two are release tooling that release.yml installs into its own
# virtualenv, and setuptools has supplied bdist_wheel itself for years.
# Listing them here made every --no-build-isolation build demand them.
requires = [
    "setuptools>=77.0.1",
    "setuptools_scm>=6.2"
]
build-backend = "setuptools.build_meta"

[project]
name = "shakenfist_client_k3s"
dynamic = ["version"]

description = "A sf-client plugin which orchestrates k3s clusters on Shaken Fist"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Michael Still", email = "mikal@stillhq.com"},
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
]
requires-python = ">=3.7"
dependencies = [
    "click >= 8.0.0",           # bsd
    "prettytable",              # bsd
    # 0.7.7 is the first release which supports the sf-agent2 side channel.
    "shakenfist_client >= 0.7.7",  # apache2
    "packaging",                # apache2 and bsd
    "pyyaml",                   # mit
    "requests",                 # apache2
    "importlib-metadata; python_version < '3.9'",  # apache2
]

[project.urls]
"Homepage" = "https://shakenfist.com"
"Bug Tracker" = "https://github.com/shakenfist/client-python-k3s/issues"

[project.entry-points."shakenfist_client.plugin"]
k3s = "shakenfist_client_k3s:load"

# include_package_data defaults to true under pyproject.toml, and
# setuptools_scm installs a file finder that offers every git-tracked
# file as package data. That re-adds the whole tests/ tree the
# packages.find exclude below correctly drops as a *package* -- the
# exclude is not the bug, this is. Nothing in this package reads a
# data file at runtime, so there is nothing legitimate to lose.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["shakenfist_client_k3s*"]
exclude = ["shakenfist_client_k3s.tests*"]

[tool.setuptools_scm]
git_describe_command = "git describe --dirty --tags --match v* --first-parent"

[project.optional-dependencies]
test = [
    "tox",                 # mit
    "flake8",              # mit
    "testtools",           # mit
    "mock",                # bsd
    "stestr",              # apache2
]
