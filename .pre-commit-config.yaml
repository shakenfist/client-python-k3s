repos:
  # Lints the agent context (AGENTS.md, PLAN-TEMPLATE.md, PUSH-AUDIT.md
  # and anything else handed to an agent) for malformed skills,
  # smuggled unicode and pasted secrets. The same hook is what CI runs,
  # so this file's rev is the only place the version is written down.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.21.0
    hooks:
      - id: skillsaw

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^tools/
        types_or: [sh, bash, shell]
        args: ['-x']

  # Lints the shakenfist.k3s collection. Local, as in the server
  # repository, because the upstream pre-commit hook has Python 3.13
  # compatibility issues; this requires ansible-lint to be installed in
  # PATH. --config-file is explicit because ansible-lint does not discover
  # a config file below the invocation cwd: "ansible-lint collection/" run
  # from the repository root silently ignores collection/.ansible-lint and
  # reports a false failure.
  #
  # Requires: pip install ansible-lint
  - repo: local
    hooks:
      - id: ansible-lint
        name: Lint the shakenfist.k3s collection
        description: Checks the Ansible collection for practices and behavior that could be improved
        entry: ansible-lint --config-file collection/.ansible-lint collection/
        language: system
        files: ^collection/
        pass_filenames: false
