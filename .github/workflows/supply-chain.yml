# Checks on the content of the repository itself: credentials in the
# history, and smuggled instructions in the agent context.
#
# Runs on every PR to develop and on pushes to develop, plus a weekly
# cron to catch drift. gitleaks-action@v2 refuses to run on
# organization repos without a paid licence, so we invoke the upstream
# gitleaks binary directly instead, which has no such restriction.
# gitleaks is only packaged from Debian 13 (trixie) onward -- bookworm
# has no gitleaks package -- so this job runs on debian-13. This
# follows ryll's supply-chain.yml, trimmed to the jobs that apply to
# a pure Python repository.
#
# Deliberately not path filtered, unlike functional-tests.yml. Every
# other lane can skip a documentation-only change; these two cannot. A
# credential pasted into a code sample is still a credential, and a
# document is exactly where an instruction aimed at an agent would be
# hidden -- so the agent context lint belongs here rather than in the
# sanity_checks job of functional-tests.yml, which skips on docs-only
# changes. The fleet audit exempts a workflow whose every job is a
# content scanner, which is what keeps this file off its report.

name: Supply chain

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  schedule:
    # Weekly at 09:00 UTC on Monday.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, vm, debian-13, s]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-gitleaks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      # --log-opts="HEAD" scopes the scan to this branch and the
      # history behind it. Without it gitleaks scans every ref, which
      # is not what anyone means by "scan this project's history": it
      # pulls in every other branch, and on a project that publishes a
      # site from one it scans a built copy of its own documentation.
      # gitleaks 8.16 then attributes those findings to unrelated merge
      # commits, so they cannot be triaged either. HEAD still reaches
      # all of develop, so nothing is given up.
      - name: Run gitleaks
        run: >-
          gitleaks detect --source . --log-opts="HEAD" --redact
          --verbose --no-banner

  agent-context:
    name: agent context
    runs-on: [self-hosted, vm, debian-12, s]
    # A venv, a pre-commit install and a lint over a handful of
    # markdown files. This is the backstop for the install.
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-agent-context
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      # Runs the pre-commit hook rather than invoking skillsaw
      # directly, so .pre-commit-config.yaml's rev is the only place
      # the version is written down. skillsaw's rule set moves between
      # releases, and renovate's pre-commit manager bumps the hook on
      # its own, so a second pin here would drift without anyone
      # choosing it. Running it in CI as well as in pre-commit is the
      # point: a hook can be skipped with --no-verify, or by a clone
      # that never ran `pre-commit install`.
      - name: Lint agent context
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-skillsaw
          . /tmp/venv-skillsaw/bin/activate
          pip3 install uv
          uv pip install pre-commit
          pre-commit run skillsaw --all-files
