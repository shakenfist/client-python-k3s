name: Functional tests

# NOTE(mikal): git repos are checked out to /srv/github/_work/{repo}/{repo}
# which is available as GITHUB_WORKSPACE. You can find other environment
# variables at:
# https://docs.github.com/en/actions/learn-github-actions/environment-variables

# Two tier CI. Every pull request runs the smoke tier: sanity checks and
# the automated reviewer. Merge queue entries and manual dispatches also
# run the merge tier, which deploys a real k3s cluster into the ephemeral
# VM runner's own per-job Shaken Fist namespace and verifies it works.
#
# The can_enqueue / can_merge collection job scheme is as described at:
# https://boinkor.net/2023/11/neat-github-actions-patterns-for-github-merge-queues/
# Both collection jobs are intended to be required status checks once the
# merge queue is enabled: can_enqueue reports on pull requests, can_merge
# on merge queue entries, and each is skipped (which GitHub treats as
# success) for the other event.

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - develop

jobs:
  sanity_checks:
    runs-on: [self-hosted, vm, debian-12]
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true

    steps:
      - name: Checkout code with two commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Upgrade base test tools
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-test
          . /tmp/venv-test/bin/activate
          pip3 install uv
          uv pip install tox tox-uv

      - name: Lint with flake8
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -eflake8

      - name: Run python3 unit tests
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -epy3

      - name: Run pre-commit hooks
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          uv pip install pre-commit
          pre-commit run --all-files

      - name: Attempt to install requirements
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-reqs
          . /tmp/venv-reqs/bin/activate
          pip3 install uv
          uv pip install -r pyproject.toml

      - name: Verify the plugin imports cleanly
        timeout-minutes: 5
        run: |
          . /tmp/venv-reqs/bin/activate
          uv pip install .
          python3 -c 'import shakenfist_client_k3s'

  automated_reviewer:
    name: "Automated reviewer"
    needs: [sanity_checks]
    # There is no pull request to review on merge_group or
    # workflow_dispatch events.
    if: github.event_name == 'pull_request'
    # A cross-repository reusable workflow cannot grant itself more
    # token scope than its caller has, so the permissions go here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main

  # The merge tier: deploy a real k3s cluster into this runner's own
  # per-job namespace on the under-cloud, verify it, expand it, and
  # delete it. The runner already carries under-cloud credentials in
  # ~/.shakenfist, and the namespace (and so anything the test leaks)
  # dies with the runner.
  cluster_deploy:
    name: "Cluster deployment"
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, vm, debian-12]
    # A full create is 15-25 minutes and the script carries its own
    # per-phase timeouts; agent operation failures abort within one poll
    # interval, so this is a backstop rather than an expected duration.
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cluster-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # setuptools_scm needs the tag history to derive a real
          # version, which the create records in the cluster's
          # plugin_version metadata.
          fetch-depth: 0

      - name: Deploy and verify a k3s cluster
        timeout-minutes: 80
        run: tools/ci_deploy_test.sh

  can_enqueue:
    name: "Can enqueue"
    # The automated reviewer is advisory and deliberately not in needs:
    # it must not be able to block enqueueing on an API hiccup.
    needs:
      - sanity_checks
    if: always() && github.event_name != 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"

  can_merge:
    name: "Can merge"
    needs:
      - sanity_checks
      - cluster_deploy
    if: always() && github.event_name == 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"
