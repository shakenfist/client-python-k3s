name: Functional tests

# NOTE(mikal): git repos are checked out to /srv/github/_work/{repo}/{repo}
# which is available as GITHUB_WORKSPACE. You can find other environment
# variables at:
# https://docs.github.com/en/actions/learn-github-actions/environment-variables

# Two tier CI. Every pull request runs the smoke tier: sanity checks and
# the automated reviewer. Merge queue entries and manual dispatches also
# run the merge tier, which deploys a real k3s cluster into the ephemeral
# VM runner's own per-job Shaken Fist namespace and verifies it works.
# Both tiers are gated on the check_paths filter job below, so a change
# touching only docs/ pays for neither.
#
# The can_enqueue / can_merge collection job scheme is as described at:
# https://boinkor.net/2023/11/neat-github-actions-patterns-for-github-merge-queues/
# Both collection jobs are intended to be required status checks once the
# merge queue is enabled: can_enqueue reports on pull requests, can_merge
# on merge queue entries, and each is skipped (which GitHub treats as
# success) for the other event.

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - develop

jobs:
  # Detect changes touching only docs/ so the ephemeral VM lanes can
  # skip. Both lanes below run on the `vm` pool, where a full cluster
  # deployment is 15-25 minutes of capacity the whole fleet shares, and
  # neither exercises a line of docs/.
  #
  # A filter job rather than trigger-level paths-ignore, because
  # can_enqueue and can_merge are required status checks: a required
  # check in a paths-ignore'd workflow never reports on a filtered pull
  # request, and a required check that never reports blocks the merge
  # forever, while a skipped one satisfies it. With a filter job the
  # workflow always reports and the heavy jobs skip on its output.
  #
  # The filter runs on merge_group as well as pull_request, so a
  # docs-only queue entry skips the cluster deployment too. On
  # workflow_dispatch the filter step is skipped and code_changed
  # defaults to true, so a manual run always tests.
  #
  # supply-chain.yml is deliberately not filtered this way: gitleaks
  # and the skillsaw agent-context lint read exactly the human-written
  # text this filter skips.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # On merge_group there is no pull request payload, so make
          # the comparison base explicit rather than letting the action
          # infer one. develop is the queue's target branch, which by
          # definition does not yet contain the queued changes, so a
          # wrong code_changed=false -- the outcome that would let "Can
          # merge" go green having tested nothing -- is structurally
          # impossible; if develop advances mid-queue the diff only
          # grows, erring toward running the tier. On pull_request
          # events the action ignores base and compares against the
          # pull request's base branch.
          base: develop
          # By default a file matches if it matches ANY listed pattern,
          # which makes '**' match everything and silently defeats the
          # exclusions. 'every' requires a file to match ALL patterns,
          # which is the correct semantics for an "everything except
          # docs" filter.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
      # Make the verdict visible in the log rather than inferred from
      # which downstream jobs skipped.
      - name: Report verdict
        run: echo "code_changed=${{ steps.filter.outputs.code || 'true (defaulted)' }}"

  sanity_checks:
    needs: check_paths
    if: needs.check_paths.outputs.code_changed != 'false'
    # xs is what this job has always had -- a runs-on which names no
    # size is not unconstrained, it falls back to the first entry in
    # the conductor's CI_SIZES table, which is xs. Linting and unit
    # tests have run there happily for the life of this repository, so
    # naming it changes nothing except making the choice a choice. It
    # needs a vm rather than a static runner because it installs
    # packages.
    runs-on: [self-hosted, vm, debian-12, xs]
    timeout-minutes: 45
    # github.ref is the right key on every event except merge_group,
    # where it is the per-attempt queue branch
    # gh-readonly-queue/develop/pr-<N>-<SHA> and GitHub mints a fresh
    # SHA every time it rebuilds the group -- which it does on every
    # push to develop. Keyed on that, every rebuild lands in a group of
    # its own, cancel-in-progress never matches, and superseded merge
    # groups run to completion holding runners the whole fleet shares.
    # See shakenfist/kerbside#284 and shakenfist/development
    # audits/merge-group-cancellation.md.
    #
    # Cancelling is safe because this queue is serial
    # (max_entries_to_build: 1), so any other in-flight merge_group run
    # is by definition superseded and its queue branch already
    # abandoned. The merge_group- prefix keeps a queue run from sharing
    # a group with a workflow_dispatch run on develop, whose github.ref
    # is the same string.
    concurrency:
      group: >-
        ${{ github.workflow }}-lint-${{
        github.event_name == 'merge_group'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code with two commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Upgrade base test tools
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-test
          . /tmp/venv-test/bin/activate
          pip3 install uv
          uv pip install tox tox-uv

      - name: Lint with flake8
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -eflake8

      - name: Run python3 unit tests
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -epy3

      - name: Run pre-commit hooks
        timeout-minutes: 10
        run: |
          . /tmp/venv-test/bin/activate
          uv pip install pre-commit
          pre-commit run --all-files

      - name: Attempt to install requirements
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-reqs
          . /tmp/venv-reqs/bin/activate
          pip3 install uv
          uv pip install -r pyproject.toml

      - name: Verify the plugin imports cleanly
        timeout-minutes: 5
        run: |
          . /tmp/venv-reqs/bin/activate
          uv pip install .
          python3 -c 'import shakenfist_client_k3s'

  automated_reviewer:
    name: "Automated reviewer"
    # The needs: list is the "review only once CI has passed" gate: a
    # job skipped because a dependency failed never starts the reusable
    # workflow. It also carries the path filter transitively -- a
    # docs-only pull request skips sanity_checks, so it skips the
    # review too, which is the same trade the vm lanes make.
    needs: [sanity_checks]
    # There is no pull request to review on merge_group or
    # workflow_dispatch events.
    if: github.event_name == 'pull_request'
    # A cross-repository reusable workflow cannot grant itself more
    # token scope than its caller has, so the permissions go here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main

  # The merge tier: deploy a real k3s cluster into this runner's own
  # per-job namespace on the under-cloud, verify it, expand it, and
  # delete it. The runner already carries under-cloud credentials in
  # ~/.shakenfist, and the namespace (and so anything the test leaks)
  # dies with the runner.
  cluster_deploy:
    name: "Cluster deployment"
    needs: check_paths
    if: >-
      needs.check_paths.outputs.code_changed != 'false' &&
      (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    # s (two vCPU, 4096 MB) rather than the xs a sizeless runs-on
    # silently falls back to. This job builds a venv, installs
    # shakenfist-client and this package into it, downloads kubectl and
    # then drives a 15-25 minute cluster create, all from the runner.
    # That is the same shape of work as the shakenfist deploy jobs
    # measured at 2.54-2.72 GB in shakenfist/actions#44, against the
    # ~1.85 GB an xs runner can actually reach with no swap device to
    # absorb anything it cannot reclaim in time.
    #
    # Unlike those jobs this one has no per-instance cost samples of
    # its own, because it never happened to land on a larger runner --
    # so s is chosen by analogy rather than measured. It is lighter
    # than they are (no wheel builds, no collection install, no ansible
    # run), so xs may well be survivable; but an OOM here costs a
    # 25-minute cluster create and looks like a flake rather than a
    # sizing fault, which is exactly how shakenfist#3696 stayed
    # invisible for months. 2 GB on at most one concurrent runner is
    # the cheaper side of that trade.
    runs-on: [self-hosted, vm, debian-12, s]
    # A full create is 15-25 minutes and the script carries its own
    # per-phase timeouts; agent operation failures abort within one poll
    # interval, so this is a backstop rather than an expected duration.
    timeout-minutes: 90
    concurrency:
      group: >-
        ${{ github.workflow }}-cluster-deploy-${{
        github.event_name == 'merge_group'
        && format('merge_group-{0}', github.event.merge_group.base_ref)
        || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # setuptools_scm needs the tag history to derive a real
          # version, which the create records in the cluster's
          # plugin_version metadata.
          fetch-depth: 0

      - name: Deploy and verify a k3s cluster
        timeout-minutes: 80
        run: tools/ci_deploy_test.sh

  can_enqueue:
    name: "Can enqueue"
    # The automated reviewer is advisory and deliberately not in needs:
    # it must not be able to block enqueueing on an API hiccup.
    needs:
      - check_paths
      - sanity_checks
    if: always() && github.event_name != 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"

  can_merge:
    name: "Can merge"
    needs:
      - check_paths
      - sanity_checks
      - cluster_deploy
    if: always() && github.event_name == 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"
