# Triggers a re-run of functional tests when an authorized user comments
# "@shakenfist-bot please retest"
#
# This is useful after bot commits (which don't trigger CI) or when you
# want to re-run checks without pushing a new commit.
#
# Template source: shakenfist/development/templates/ci-review-automation/

name: PR Retest

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  trigger-retest:
    name: "Trigger retest"
    # Only run on PR comments (not issue comments)
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@shakenfist-bot please retest')
    runs-on: [self-hosted, static]
    # Just a few gh API calls, so anything beyond this is a hang.
    timeout-minutes: 10

    steps:
      - name: Handle trigger
        id: trigger
        uses: shakenfist/actions/pr-bot-trigger@main
        with:
          trigger-phrase: 'please retest'
          reaction: 'rocket'

      - name: Trigger functional tests
        id: dispatch
        if: steps.trigger.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REF: ${{ steps.trigger.outputs.pr-ref }}
        run: |
          echo "Triggering functional tests on branch: ${PR_REF}"

          # A fork PR's head branch does not exist in this repository,
          # so the dispatch fails with "no ref found". Report that to
          # the requester rather than claiming success.
          if gh workflow run functional-tests.yml \
            --repo "${{ github.repository }}" \
            --ref "${PR_REF}"; then
            echo "dispatched=true" >> $GITHUB_OUTPUT
            echo "Functional tests triggered successfully"
          else
            echo "dispatched=false" >> $GITHUB_OUTPUT
            echo "Functional tests dispatch failed"
          fi

      - name: Post confirmation
        if: steps.trigger.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REF: ${{ steps.trigger.outputs.pr-ref }}
        run: |
          if [ "${{ steps.dispatch.outputs.dispatched }}" = "true" ]; then
            gh pr comment "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" \
              --body "Triggered functional tests on branch \`${PR_REF}\`.

          [View workflow runs](https://github.com/${{ github.repository }}/actions/workflows/functional-tests.yml)"
          else
            gh pr comment "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" \
              --body "Unable to trigger functional tests on \`${PR_REF}\`. This usually means the PR is from a fork, whose branch does not exist in this repository -- please re-run the failed workflow from the Actions tab instead."
          fi
